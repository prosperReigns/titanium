services:
  postgres:
    image: postgres:17-alpine
    container_name: titanium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-titanium}
      POSTGRES_USER: ${POSTGRES_USER:-titanium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - titanium_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-titanium} -d ${POSTGRES_DB:-titanium}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  titanium_postgres_data:
